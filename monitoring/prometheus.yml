global:
  scrape_interval: 15s

scrape_configs:
  - job_name: course-service
    static_configs:
      - targets: ["course-service:8000"]
  - job_name: enrollment-service
    static_configs:
      - targets: ["enrollment-service:8000"]
  - job_name: api-gateway
    static_configs:
      - targets: ["api-gateway:8000"]